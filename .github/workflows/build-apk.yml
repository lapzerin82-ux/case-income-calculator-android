name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate branded Android icons
        run: |
          mkdir -p assets
          curl --fail --location "https://case-income-calculator.lapzerin82.chatgpt.site/icon-512.png" --output assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor "#173b64"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Case-Income-Calculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Case-Income-Calculator-APK
          path: Case-Income-Calculator.apk
          retention-days: 30
